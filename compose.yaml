services:
  minio:
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  airflow:
    build: .
    command: ["bash", "/app/scripts/start_airflow.sh"]
    environment: &pipeline-environment
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-taxi-lake}
      START_DATE: ${START_DATE:-2023-01-01}
      END_DATE: ${END_DATE:-2023-01-08}
      PAGE_SIZE: ${PAGE_SIZE:-10000}
      SODA_API_VERSION: ${SODA_API_VERSION:-2}
      SODA_APP_TOKEN: ${SODA_APP_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow-data:/opt/airflow
    depends_on:
      - minio

  api:
    build: .
    command: python -m uvicorn pipeline.api:app --host 0.0.0.0 --port 8000
    environment: *pipeline-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - minio

volumes:
  minio-data:
  airflow-data:
